<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FrostAir — климатические системы</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="theme-cold">

  <!-- Шапка сайта — она же сам кондиционер: меню и управление на его корпусе -->
  <header class="ac-header" id="acHeader">
    <div class="ac-header__casing wrap">
      <div class="ac-header__logo">FrostAir<span class="dot">.</span></div>

      <nav class="ac-header__nav" id="acNav">
        <a href="#hero">Главная</a>
        <a href="#catalog">Каталог</a>
        <a href="#about">О нас</a>
        <a href="#contacts" class="ac-header__cta">Заказать</a>
      </nav>

      <div class="ac-header__controls">
        <div class="ac-header__display"><span data-temp-display>18°C</span></div>
        <button class="ac-header__power" data-theme-toggle aria-label="Переключить режим климата">
          <i class="fa-solid fa-power-off"></i>
        </button>
        <button class="ac-header__burger" id="acBurger" aria-label="Открыть меню" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <!-- вентиляционная решётка — нижняя кромка корпуса -->
    <div class="ac-header__vent" aria-hidden="true"></div>

    <!-- выпадающее меню на мобильном: на корпусе не хватает места под все пункты -->
    <nav class="ac-header__dropdown" id="acDropdown">
      <a href="#hero">Главная</a>
      <a href="#catalog">Каталог</a>
      <a href="#about">О нас</a>
      <a href="#contacts" class="ac-header__cta">Заказать</a>
    </nav>
  </header>

  <section id="hero" class="hero">
    <div class="side-air left" aria-hidden="true"></div>
    <div class="side-air right" aria-hidden="true"></div>
    <div class="air-flow-down" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="wrap">
      <div class="hero-content">
        <h1>Комфорт в одно <br><span class="accent">касание</span></h1>
        <p class="lead">Интеллектуальный климат. Нажмите на кнопку <b>Power</b> на кондиционере наверху для смены режима.</p>
        <div class="hero-actions">
          <a href="#catalog" class="btn">Каталог моделей</a>
        </div>
      </div>
    </div>
  </section>

  <section id="catalog" class="catalog">
    <div class="wrap">
      <h2>Каталог систем</h2>
      <div id="productsGrid" class="products-grid"></div>
    </div>
  </section>

  <footer id="contacts" class="footer">
    <div class="wrap">
      <p>© <span id="year"></span> FrostAir — Технологии комфорта</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
